<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>LegoVerse - Deep Insights</title>
  <link rel="stylesheet" href="src/style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">正在构建乐高多维宇宙...</div>
  </div>

  <div class="container">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="header">
        <h1>LEGO <span class="highlight">INSIGHTS</span></h1>
        <p>1950-2017 数据演化分析</p>
      </div>

      <div class="controls">
        <div class="control-group">
          <label>分析透镜</label>

          <!-- 视图 1 -->
          <button class="btn active" onclick="switchLayout('bar')">
            <span class="icon">📊</span>
            <div class="btn-text">
              <strong>Top 10 榜单</strong>
              <small>动态堆叠 (Floating Stack)</small>
            </div>
          </button>

          <!-- 视图 2 -->
          <button class="btn" onclick="switchLayout('timeline')">
            <span class="icon">🌊</span>
            <div class="btn-text">
              <strong>历史演变长河</strong>
              <small>时间流 (Stream)</small>
            </div>
          </button>

          <!-- 视图 3 -->
          <button class="btn" onclick="switchLayout('radial')">
            <span class="icon">🕸️</span>
            <div class="btn-text">
              <strong>复杂性雷达</strong>
              <small>极坐标 (Radial + Time)</small>
            </div>
          </button>

          <!-- 视图 4 (视觉强化版) -->
          <button class="btn" onclick="switchLayout('distribution')">
            <span class="icon">🏔️</span>
            <div class="btn-text">
              <strong>复杂度分布峰峦</strong>
              <small>全景直方图 (Histogram)</small>
            </div>
          </button>
        </div>

        <div class="control-group">
          <label>交互控制台</label>
          <div id="interaction-hint" class="hint-box">
            <!-- 动态提示 -->
          </div>

          <!-- 图表1 专用控制 -->
          <div id="bar-controls" class="sub-controls hidden">
            <div class="toggle-label">数据模式:</div>
            <div class="toggle-group">
              <button class="toggle-btn active" id="mode-drop" onclick="setBarMode('drop')">时光折叠</button>
              <button class="toggle-btn" id="mode-slice" onclick="setBarMode('slice')">单年切片</button>
            </div>
          </div>

          <!-- 滑块控件 -->
          <div id="slider-controls" class="sub-controls hidden">
            <div class="slider-label">
              <span id="slider-title">TIME CONTROL: </span>
              <span id="year-display" class="year-val">1950 - 2017</span>
            </div>
            <input type="range" id="time-slider" min="1950" max="2017" value="1950" step="1">
          </div>
        </div>
      </div>

      <div class="legend-panel">
        <h4>主题图例 (点击高亮)</h4>
        <div id="legend-container"></div>
      </div>

      <div class="stats-panel">
        <div class="stat-box">
          <span class="stat-label">可见套装</span>
          <span class="stat-val" id="total-count">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">当前视角</span>
          <span class="stat-val" id="current-view-name">热门榜单</span>
        </div>
      </div>
    </div>

    <!-- 绘图区 -->
    <div class="vis-container">
      <canvas id="main-canvas"></canvas>
      <svg id="overlay-svg"></svg>
      <div id="tooltip" class="tooltip"></div>
    </div>
  </div>

  <script src="src/main.js"></script>
</body>

</html>
