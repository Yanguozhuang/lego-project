<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>LegoVerse - Deep Insights</title>
  <link rel="stylesheet" href="src/style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">正在构建乐高多维宇宙...</div>
  </div>

  <div class="container">
    <!-- 侧边栏：分析叙事 -->
    <div class="sidebar">
      <div class="header">
        <h1>LEGO <span class="highlight">INSIGHTS</span></h1>
        <p>1950-2017 数据演化分析</p>
      </div>

      <div class="controls">
        <div class="control-group">
          <label>分析透镜 (Perspectives)</label>

          <!-- 视图 1 -->
          <button class="btn active" onclick="switchLayout('bar')">
            <span class="icon">📊</span>
            <div class="btn-text">
              <strong>Top 热门榜单</strong>
              <small>粒子堆叠柱状图 (Stack)</small>
            </div>
          </button>

          <!-- 视图 2 -->
          <button class="btn" onclick="switchLayout('timeline')">
            <span class="icon">🌊</span>
            <div class="btn-text">
              <strong>历史演变长河</strong>
              <small>时间流 (Stream)</small>
            </div>
          </button>

          <!-- 视图 3 (创新点) -->
          <button class="btn" onclick="switchLayout('radial')">
            <span class="icon">🌀</span>
            <div class="btn-text">
              <strong>复杂性星系</strong>
              <small>极坐标螺旋 (Radial Spiral)</small>
            </div>
          </button>
        </div>
      </div>

      <!-- 动态图例 -->
      <div class="legend-panel">
        <h4>主题图例 (点击高亮)</h4>
        <div id="legend-container"></div>
      </div>

      <div class="stats-panel">
        <div class="stat-box">
          <span class="stat-label">总套装数</span>
          <span class="stat-val" id="total-count">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">当前视角</span>
          <span class="stat-val" id="current-view-name">热门榜单</span>
        </div>
      </div>
    </div>

    <!-- 绘图区 -->
    <div class="vis-container">
      <canvas id="main-canvas"></canvas>
      <svg id="overlay-svg"></svg> <!-- 用于绘制坐标轴 -->
      <div id="tooltip" class="tooltip"></div>
    </div>
  </div>

  <script src="src/main.js"></script>
</body>

</html>
